releaseNotes: >-
  Nodes start again. Formicaio 0.8.4 (the official Umbrel app) passes
  --bootstrap-cache-dir, which current ant-node releases reject, so every
  node start or restart ended with "Exited (exit status: 2)". This build is
  based on Formicaio 0.8.8, which no longer passes it.


  New nodes now join the network: ant-node's bootstrap_peers.toml is kept
  next to the node binary, where before nodes started with no bootstrap
  peers and never connected.


  Other fixes: node status no longer freezes after a node upgrades itself
  twice; a restarted app no longer mistakes another node's process for a
  stale one; deleting a node always stops its process; stored records, CPU
  and memory are shown again (system metrics are the default); cancelling a
  queued batch works; the autonomous AI agent can no longer delete, stop,
  recycle or upgrade nodes; a failed binary download no longer restarts all
  nodes on every version check; earnings no longer miss or double-count
  payments; the widget shows disk used instead of an always-zero network
  size; the web UI is no longer reachable from the LAN without Umbrel's login.
